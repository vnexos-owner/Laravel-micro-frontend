services:
  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./BE:/var/www
      - vue_dist:/usr/share/nginx/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel_network
    depends_on:
      - app
      - ui
      - vui
  vui:
    build:
      context: ./VFE
      dockerfile: Dockerfile
    container_name: laravel_vui
    volumes:
      - vue_dist:/app/dist
    environment:
      - NODE_ENV=production
  ui:
    build:
      context: ./FE
      # dockerfile: Dockerfile.dev
      dockerfile: Dockerfile
    container_name: laravel_ui
    # volumes:
    #   - ./FE:/app
    #   - /app/node_modules
    environment:
      # - NODE_ENV=development
      - NODE_ENV=production
      # - WATCHPACK_POLLING=true # Enable polling (needed in Docker)
      # - CHOKIDAR_USEPOLLING=true # Fallback polling watcher
    networks:
      - laravel_network
  app:
    build:
      context: BE
      dockerfile: Dockerfile
    container_name: laravel_app
    volumes:
      - ./BE:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - laravel_network
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:latest
    container_name: laravel_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - laravel_network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  db_data:
    driver: local
  vue_dist:

networks:
  laravel_network:
    driver: bridge
