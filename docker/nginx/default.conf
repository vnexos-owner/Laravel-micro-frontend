# --- HTTP: Redirect all traffic to HTTPS ---
server {
    listen 80;
    server_name dev.vnexos.com;
    
    return 301 https://$host$request_uri;
}

# --- HTTPS: Secure Server Block ---
server {
    listen 443 ssl;
    server_name dev.vnexos.com;

    # SSL Certificate Paths (Mounted inside the Docker container)
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Modern Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Project Root Settings
    root /var/www/public;
    index index.php index.html;

    # Backend API — forwards to PHP-FPM
    location /api/ {
        try_files $uri $uri/ @api_php;
    }

    location @api_php {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        include fastcgi_params;
    }

    # Frontend — proxy to frontend container on port 3000
    location /dashboard {
        proxy_pass http://ui:3000;
        proxy_http_version 1.1;

        # WebSocket support (required for Next.js hot-reload)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Required headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }

    # Next.js static assets & HMR websocket
    location /_next/webpack-hmr {
        proxy_pass http://ui:3000/_next/webpack-hmr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_read_timeout 86400;   # Keep HMR connection alive
    }

    location /_next/static/ {
        proxy_pass http://ui:3000/_next/static/;
        proxy_cache_bypass $http_upgrade;

        # Cache static assets aggressively
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # VueJS fallback block
    location / {
        root /usr/share/nginx/html; # Dedicated, safe Nginx directory for Vue build
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}